[package]
name = "harbor-library"
version = "0.1.0"
description = "A private creative reference space for two game developers"
authors = ["Harbor Market"]
edition = "2021"

[lib]
name = "harbor_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
